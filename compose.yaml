# magic-box on the Jetson in Docker. The ZED SDK lives in the image; the repo is mounted at /app,
# so .env, config.local.yaml, recordings/ and code edits work exactly as on the host.
#   docker compose build                                    # once, and after pyproject/uv.lock change
#   DISPLAY=:0 docker compose up                            # the demo: scripts/run_demo.sh
#   docker compose run --rm magic-box <any runbook command> # e.g. uv run python scripts/check_env.py
# Only one process can open the ZED X at a time: stop anything else that uses it first.
# Owner: Daniel + Enoch
name: magic-box

services:
  magic-box:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: magic-box:latest
    runtime: nvidia
    privileged: true # GMSL camera devices and the mics (/dev/snd)
    network_mode: host # Muse and Spark
    ipc: host
    pid: host # check_env.py sees the host's ZEDX_Daemon (there is no systemd in the container)
    init: true # passes Ctrl-C and `docker compose stop` on to run_demo.sh
    stdin_open: true
    tty: true
    working_dir: /app
    environment:
      # Passed through only when set (DISPLAY=:0 docker compose ... for a window). Never default it:
      # a DISPLAY that X refuses, even an empty one, breaks the ZED X capture (Argus EGL buffers).
      - DISPLAY
    volumes:
      - .:/app
      - /dev:/dev
      - /tmp:/tmp # nvargus socket (/tmp/argus_socket) and the X11 socket
      - /var/nvidia/nvcam/settings:/var/nvidia/nvcam/settings
      - /etc/systemd/system/zed_x_daemon.service:/etc/systemd/system/zed_x_daemon.service:ro
      - zed-resources:/usr/local/zed/resources # AI models; the first run optimizes them (minutes)
      - zed-settings:/usr/local/zed/settings # camera calibration
    # No restart policy: run_demo.sh restarts the game itself, and at boot the container would race
    # other ZED users for the camera.

volumes:
  zed-resources:
  zed-settings:
