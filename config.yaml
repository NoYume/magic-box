# ALL tunables live here. "(guess)" = untuned until tested on recordings.
# Per-machine overrides (mic devices, fullscreen) go in config.local.yaml (gitignored), deep-merged on top.

display:            # owner: Adetola + Nikhil
  width: 1920
  height: 1080
  fps: 60
  fullscreen: false
  vsync: false                # true: SCALED + vsync, can cap fps at the monitor rate
  web:                        # --web: stream the game to a browser (no monitor at the venue)
    host: 0.0.0.0
    port: 8000
    stream_width: 1280        # JPEG width; the game still draws at width x height
    stream_fps: 30
    jpeg_quality: 80

camera:             # owner: Enoch
  model: ZED_X                # scripts/check_env.py compares the connected camera's model
  resolution: SVGA            # ZED X: SVGA (960x600) | HD1080 | HD1200; image size must match
  image_width: 960
  image_height: 600
  fps: 30
  depth_mode: PERFORMANCE
  body_format: BODY_34        # BODY_18 | BODY_34 | BODY_38 (34 and 38 need body_fitting)
  body_model: HUMAN_BODY_FAST
  body_fitting: true
  detection_confidence: 40
  max_range_m: 3.5            # (guess) depth and bodies beyond this are ignored (bystanders)
  svo_path: null              # play this .svo2 instead of the live camera (Jetson only)
  record_svo: null            # record the live camera to this .svo2 path

perception:         # owner: Enoch
  push_speed_mps: 1.5         # (guess) wrist speed toward the camera, relative to the neck
  push_min_travel_m: 0.12     # (guess) wrist travel toward the camera within the window
  push_window_s: 0.15         # (guess)
  push_rearm_ratio: 0.35      # (guess) re-arm once speed drops below this share of push_speed_mps
  push_cooldown_s: 0.4        # (guess)
  motion_window_s: 0.2        # (guess)
  slot_hold_s: 1.0            # (guess) a lost body keeps its slot this long
  hands_up_margin_m: 0.10     # (guess) wrist above the head by this much
  hands_together_max_m: 0.25  # (guess) wrists closer than this
  guard_forward_m: 0.35       # (guess) a wrist this far in front of the neck, between head and shoulder height, is the knight's guard
  open_retry_s: 2.0
  max_grab_failures: 30
  stats_every_s: 5.0
  zones:                      # root Z thresholds, meters (guess)
    danger_max_m: 1.3         # z < this -> danger (red). Was 1.6: red took the whole area close enough to read the screen
    far_min_m: 1.9            # z >= this -> far (blue). Was 2.4: too far back to read the screen
  push_peak_wait_s: 0.1       # (guess) max wait after detection for the thrust to peak; Push.speed is the peak. Adds to intent.two_hand_window_s

pipeline:           # owner: Nikhil
  state_queue_size: 256
  voice_queue_size: 64
  control_queue_size: 8
  stale_state_s: 0.2
  restart_backoff_s: 1.0
  max_restarts: 5
  restart_reset_s: 60.0       # a child alive this long gets its restart count back
  camera_stale_s: 1.5         # live: no new frame_idx for this long = camera not ok
  camera_boot_timeout_s: 5.0  # live: no first frame by now = camera check fails
  network_probe_timeout_s: 3.0
  stop_timeout_s: 2.0         # on quit, wait this long for children to exit on their own (perception closes the ZED)
  terminate_timeout_s: 1.0    # then SIGTERM and wait this long; after that SIGKILL
  perf_window_s: 10.0         # perf summary window (overlay header, --debug print)

intent:             # owner: Nikhil
  dodge_step_m: 0.3           # (guess)
  dodge_duck_m: 0.25          # (guess)
  dodge_lookback_s: 0.4       # (guess)
  two_hand_window_s: 0.1      # (guess) other hand within this of the push; a one-hand push waits this long

voice:              # owner: Nikhil (devices: Daniel)
  enabled: true
  url: wss://api.meta.ai/v1/asr/realtime
  model: muse-voice-transcribe-1.0
  api_key_env: META_MODEL_API_KEY
  sample_rate: 16000
  chunk_ms: 80
  match_threshold: 80
  perfect_threshold: 95
  perfect_hold_s: 0.5         # hold a sub-perfect match this long for a better partial; 0 = off.
  #                             Live 2026-10-25: the whole phrase lands 0-0.9 s (median 0.4 s)
  #                             after the first prefix match. A held match publishes up to about
  #                             +0.8 s after speech, so game.charge_window_s stays 3.0 until the
  #                             Jetson lav-mic run (scripts/check_muse.py --record, voice/CLAUDE.md)
  handshake_timeout_s: 5
  reconnect_backoff_s: 1.0
  reconnect_max_s: 10.0
  session_max_s: 3300         # reopen before Muse's 60-minute limit
  silence_after_s: 0.2        # send zeros if the mic is quiet this long
  min_keyword_chars: 4
  crosstalk_margin_db: 6.0    # (guess) drop a lobby/victory transcript when the other lav mic was
  #                             this many dB louder during it (it was the other player talking);
  #                             0 or less turns the check off. Incantations are never checked
  crosstalk_window_s: 6.0     # crosstalk lookback when Muse gave no speechStart for the turn: the
  #                             final lands ~3.3 s after speech ends, so this covers ~2.7 s of speech
  audio_queue_chunks: 25      # per-slot mic buffer (2 s at 80 ms chunks)
  mics:                       # device null = system default; set real devices in config.local.yaml
    - {slot: 0, device: null, channel: 0}
    - {slot: 1, device: null, channel: 1}

ai:                 # owner: Nikhil
  enabled: true
  base_url: https://api.meta.ai/v1
  model: muse-spark-1.3
  timeout_s: 8
  api_key_env: META_MODEL_API_KEY
  temperature: 0.9            # (guess)
  min_words: 3
  max_words: 7
  max_cross_similarity: 60    # (guess) rapidfuzz ratio between the two players' incantations
  chronicle_max_words: 120
  reasoning_effort: minimal   # minimal|low|medium|high|xhigh, null = model default. Measured
  #                             2026-10-25: model default timed out at 8 s, low 6.2 s, minimal 3.1-3.8 s

game:               # owner: Adetola. DRAFT numbers, see docs/game-design.md
  round_s: 90
  hp_max: 100
  mana_max: 100
  mana_regen_per_s: 8
  charge_window_s: 3.0
  dodge_window_s: 0.6
  basic_attack_cooldown_s: 0.8
  basic_attack_damage: 8      # (guess)
  basic_attack_travel_s: 0.7  # (guess)
  perfect_mult: 1.15
  banner_s: 1.2
  loading_min_s: 3.0
  loading_max_s: 10.0
  howto_s: 7.0                # loading opens with a how-to-play screen this long (Spark writes meanwhile); the spell cards' read time starts after it
  loading_read_s: 4.0         # loading also lasts this long after the incantations arrive (Spark takes 3.1-3.8 s), so players can read them
  victory_min_s: 5.0
  victory_max_s: 20.0          # back to the lobby at this point whatever happens (was 30)
  menu_words: [main menu, menu, play again, rematch, restart, reset]  # said on the victory screen: back to the lobby at once
  victory_read_s: 4.0         # a hands-up exit from victory also waits this long after the chronicle arrives (Spark: up to ai.timeout_s)
  pause_after_s: 2.0
  name_max_chars: 12
  name_max_words: 2           # a lobby name is at most this many words
  name_stop_words: [          # never part of a lobby name (chatter); quoted so YAML keeps yes/no/on as words
    "a", "an", "the", "and", "or", "but", "i", "im", "i'm", "it", "it's", "its", "me", "my", "you",
    "we", "pick", "picks", "choose", "chooses", "want", "wanna", "play", "playing", "as", "with",
    "is", "be", "to", "do", "please", "um", "uh", "oh", "ready", "here", "good", "fine", "ok",
    "okay", "yes", "yeah", "no", "done", "going", "gonna", "trying", "not", "so", "just", "in",
    "on", "at", "this", "that", "what", "how", "hello", "hi", "hey", "now", "too", "thanks",
    "thank", "wait", "cool", "nice", "great", "sure", "right", "let's", "lets", "go", "start", "fight"]
  boot_min_s: 2.0             # boot: shortest self-check screen; leaves once the camera is ok
  boot_max_s: 8.0             # boot: go to the lobby at this point whatever the checks say
  hands_up_hold_s: 0.3        # (guess) hands up, or down, must hold this long to count (Jetson flicker)
  abandon_after_s: 20.0       # a pause this long ends the match: the tracked player wins, draw if both gone
  ko_hold_s: 2.5              # after a KO the fight scene stays (frozen) this long for the finishing FX; keep render.fx.ko_s equal to it (validated <=). Time-outs don't hold
  empowered_mult: 1.5         # Holy Light: the caster's spells and basic attacks x this while empowered
  mana_slow_mult: 0.25        # Static Field: the target's mana regen x this while slowed
  slow_charge_mult: 0.6       # Inferno: the target's next charge window x this
  release_grace_s: 0.6        # (guess, Task 5 measured charge landing +0.4 s, worst +0.6 s after speech) mic on: a push with no charge waits this long for one
  pose_grace_s: 1.0           # (guess) covers the measured ~0.8 s worst charge latency: a charge releases a pose already held only if it rose this recently
  parry_classes: [holy_knight]  # classes whose guard pose parries
  parry_window_s: 0.4         # (guess) a guard raised this close before impact parries the projectile
  parry_cooldown_s: 1.5       # (guess) from a guard raise to the next one that counts
  riposte_window_s: 1.5       # (guess) after a parry, the next uncharged push fires a riposte
  riposte_damage: 20          # (guess)
  riposte_travel_s: 0.5       # (guess)
  combat:
    speed_ref_mps: 2.0
    speed_mult_min: 0.6
    speed_mult_max: 1.8
    near_m: 1.1               # full near_mult at or inside this (was 1.2)
    near_mult: 1.4
    far_m: 2.2                # full far_mult at or beyond this (was 2.8, out of reading range)
    far_mult: 0.7
  default_classes: {0: fire_mage, 1: holy_knight}
  classes:
    fire_mage:
      name: Fire Mage
      keywords: [fire]          # saying one of these in the lobby picks the class
      spells:
        - {id: fireball, name: Fireball, cost: 25, damage: 18, travel_s: 1.6, release: push,
           fallback: {0: "embers of the forty acres burn", 1: "ignite the longhorn flame"}}
        - {id: flame_wall, name: Flame Wall, cost: 30, damage: 0, travel_s: 0, release: two_hand_push,
           effect: shield, effect_s: 4,                                               # blocks the next hit
           fallback: {0: "rise crimson rampart", 1: "wall of burning cedar"}}
        - {id: inferno, name: Inferno, cost: 60, damage: 35, travel_s: 2.2, release: push,
           effect: slow, effect_s: 3,                                                 # shorter next charge
           fallback: {0: "let the whole sky catch fire", 1: "summon the sixth street inferno"}}
    lightning_mage:
      name: Lightning Mage
      keywords: [lightning, lightening]   # an ASR spelling; the first keyword is the one shown
      spells:
        - {id: bolt, name: Bolt, cost: 20, damage: 12, travel_s: 0.9, release: push,
           fallback: {0: "storm of speedway strike", 1: "lightning answer my call"}}
        - {id: chain, name: Chain, cost: 35, damage: 7, travel_s: 1.2, release: push,
           hits: 3, chain_gap_s: 0.25,                                                # 3 bolts, each dodgeable
           fallback: {0: "thunder binds the tower", 1: "chain the storm across the river"}}
        - {id: static_field, name: Static Field, cost: 30, damage: 0, travel_s: 1.4, release: two_hand_push,
           effect: mana_slow, effect_s: 5,                                            # slows mana regen
           fallback: {0: "static fills the air", 1: "hum of the restless grid"}}
    holy_knight:
      name: Holy Knight
      keywords: [holy, knight]
      spells:
        - {id: holy_light, name: Holy Light, cost: 30, damage: 0, travel_s: 0, release: arm_overhead,
           effect: empowered, effect_s: 6,                                            # x empowered_mult
           fallback: {0: "light of the tower guide my blade", 1: "dawn breaks upon my sword"}}
        - {id: heal, name: Heal, cost: 40, damage: 0, travel_s: 0, release: hands_together,
           heal_hp: 25,                                                               # capped at hp_max
           fallback: {0: "mend me gentle light", 1: "breath of the hill country heal"}}
        - {id: judgment, name: Judgment, cost: 45, damage: 25, travel_s: 1.5, release: push,
           fallback: {0: "judgment falls from above", 1: "steel and sunlight strike true"}}

render:             # owner: Adetola (hud, scenes) + Nikhil (camera_view, projectiles)
  crop_aspect: [8, 9]
  crop_padding: 0.15
  crop_smoothing: 0.25        # EMA alpha per drawn frame
  camera_scale_quality: fast  # fast = pygame scale | smooth = smoothscale (prettier, slower)
  self_view: true             # false skips the mirrored self-view (saves fps)
  crop_cache_px: 2            # reuse a cached crop while the crop rect moved less than this (px)
  crop_cache: true            # reuse the scaled crop when frame_idx and crop are unchanged
  selfview_width_frac: 0.26
  margin_px: 16
  hud_height_frac: 0.26
  divider_px: 4
  divider_rgb: [201, 162, 39]
  background_rgb: [11, 8, 20]
  debug_overlay:    # owner: Enoch
    graph_s: 3.0
    vz_range_mps: 4.0
    push_flash_s: 0.3
    topdown_x_m: 2.0
    topdown_z_m: 4.0
    font_px: 22
    panel_w_px: 420
    graph_h_px: 120
    map_px: 240
    pad_px: 6
    dot_radius_px: 8
    panel_rgba: [0, 0, 0, 170]
    text_rgb: [240, 240, 240]
    slot_rgb: {0: [255, 140, 40], 1: [40, 140, 255]}
    threshold_rgb: [230, 60, 60]
    zone_rgb: {danger: [110, 30, 30], neutral: [70, 70, 40], far: [30, 50, 90]}
  projectiles:                # owner: Nikhil (sprites: Adetola)
    start_radius_px: 18
    end_radius_px: 140
    end_y_frac: 0.85
    font_px: 64
    default_rgb: [255, 220, 120]
    dodge_rgb: [230, 50, 50]
    rgb: {basic: [240, 240, 240], fireball: [255, 120, 30], inferno: [255, 60, 0],
          bolt: [120, 180, 255], chain: [160, 140, 255], judgment: [255, 230, 120],
          riposte: [190, 230, 255]}
    family: {basic: basic, fireball: fire, inferno: fire, flame_wall: fire, bolt: lightning,
             chain: lightning, static_field: lightning, judgment: holy, holy_light: holy, heal: holy,
             riposte: holy}
    glow_scale: 2.4           # glow radius / core radius
    glow_max_px: 224          # largest glow radius (bigger requests are clamped)
    glow_step_px: 8           # glow sprites are cached every 8 px up to glow_big_from_px,
    glow_big_from_px: 64      #   then every glow_big_step_px up to glow_max_px
    glow_big_step_px: 32
    trail_steps: 6            # ghost copies behind the projectile
    trail_spacing: 0.04       # progress between trail copies
    dodge_ring_px: 10
  theme:                      # owner: Adetola. shared colors and font sizes (pygame default font)
    font_px: {tiny: 22, small: 28, text: 34, big: 46, huge: 72, giant: 180}
    display_font: assets/fonts/CinzelDecorative-Bold.ttf   # titles, headline, KO (OFL); missing = default font
    title_px: {boot: 150, lobby: 130, headline: 150, ko: 240, banner: 110}
    shadow_px: 3
    text_cache_max: 1024
    colors:
      text: [245, 242, 235]
      dim: [150, 146, 165]
      faint: [95, 90, 110]
      shadow: [0, 0, 0]
      gold: [236, 192, 72]
      ok: [80, 225, 120]
      bad: [240, 70, 70]
      warn: [255, 196, 64]
      panel: [12, 9, 26]
      panel_edge: [201, 162, 39]
      card: [26, 20, 48]
      card_hi: [52, 38, 92]
      p1: [255, 140, 40]      # slot 0
      p2: [70, 165, 255]      # slot 1
      bg_top: [24, 14, 44]
      bg_bottom: [6, 4, 12]
      fire: [255, 120, 30]
      lightning: [120, 180, 255]
      holy: [255, 225, 120]
      basic: [235, 235, 255]
      mana: [70, 120, 255]
      white: [255, 255, 255]
      black: [0, 0, 0]
      ink: [10, 10, 16]        # marks and dark chip text
      icon_bg: [20, 16, 30]
      fire_hot: [255, 230, 120]
      fire_core: [255, 240, 200]
    panel_alpha: 200
    stars: {count: 140, brightness: [40, 140], blue: 40}  # scene backdrop
    radius_px: 14
  hud:                        # owner: Adetola
    pad_px: 14
    hp_bar_h_px: 38
    mana_bar_h_px: 24
    enemy_bar_h_px: 40
    ease_per_s: 10.0          # bar easing rate toward the target value
    ghost_hold_s: 0.45        # the damage ghost waits this long, then drains
    ghost_per_s: 3.0
    low_hp_frac: 0.3          # HP bar turns low_hp color and pulses below this
    spell_row_h_px: 58
    effect_icon_px: 44
    hp_rgb: [70, 215, 95]
    hp_low_rgb: [235, 60, 60]
    ghost_rgb: [255, 240, 200]
    mana_rgb: [70, 120, 255]
    bar_back_rgb: [28, 24, 40]
    charge_rgb: [255, 220, 90]
    cooldown_rgb: [170, 170, 190]
    zone_rgb: {danger: [235, 70, 60], neutral: [235, 200, 70], far: [80, 150, 240]}
    effect_rgb: {shield: [255, 140, 50], empowered: [255, 225, 110], mana_slow: [150, 120, 255],
                 slow: [120, 200, 255]}
    timer_low_s: 10           # round timer turns red below this
    zone_meter_m: [0.8, 2.6]  # distance span of the zone meter (ends clamp)
  fx:                         # owner: Adetola. hit flash, shake, numbers, particles
    max_particles: 160        # hard cap so the Jetson stays at 60 fps
    max_texts: 12
    shake_px: 16
    shake_s: 0.3
    flash_s: 0.3
    flash_alpha: 150
    number_s: 1.1
    number_rise_px: 140
    sparkle_count: 28
    burst_count: 24
    particle_s: 0.9
    glow_s: 1.2
    ko_s: 2.5                 # KO banner + slow motion; keep equal to game.ko_hold_s (validated <=; the frozen fight after a KO)
    ko_slowmo: 0.35           # FX time runs at this rate during the KO banner
    banner_pop_s: 0.22
    hit_rgb: [255, 50, 40]
    damage_rgb: [255, 235, 120]
    dodge_rgb: [120, 255, 200]
    block_rgb: [120, 200, 255]
    heal_rgb: [110, 255, 140]
    buff_rgb: [255, 220, 100]
    ko_rgb: [255, 60, 50]
    glow_heal_s: 0.6          # edge glow lengths: heal, cast pulse, match start
    glow_cast_s: 0.35
    glow_start_s: 0.8
    particle_gravity_px: 600  # px/s^2 on burst particles
    speed_px: {hit: 520, hit_side: 300, graze: 320, dodge: 420, block: 380}  # px/s
    ring_count: {dodge: 18, block: 26}
    burst_size_px: [6, 14]    # particle radius ranges at spawn
    ring_size_px: 10
    sparkle_size_px: [5, 11]
    sparkle_rise_px: [80, 220]  # px/s upward
    sparkle_drift_px: 30      # px/s sideways (+-)
    spell_effect: {flame_wall: shield, holy_light: empowered, static_field: mana_slow, inferno: slow}  # buff fallback
  audio:                      # owner: Adetola. synthesized at startup; silent if the mixer cannot open
    enabled: true
    volume: 0.6
    sample_rate: 44100
    buffer: 512
    tick_last_s: 5            # fight: tick each second of the last N seconds
    mix_channels: 16          # sounds that can overlap
  scenes:                     # owner: Adetola
    title_px: 96
    text_px: 36
    text_rgb: [240, 240, 240]
    dim_rgb: [150, 150, 160]
    card_w_frac: 0.86         # card width / half width
    countdown_px: 260
    chronicle_w_frac: 0.7

keys:               # owner: Nikhil. pygame key names
  spells: {0: ["1", "2", "3"], 1: ["8", "9", "0"]}   # keyboard fallback, always active
  debug_overlay: f1
  reset: backspace            # operator: back to the lobby from any scene, names and classes kept
  quit: escape
  fake:
    0: {left: a, right: d, closer: w, farther: s, push: f, duck: c, hands_up: r, hands_together: t, two_hand_push: v, guard: g}
    1: {left: j, right: l, closer: i, farther: k, push: h, duck: n, hands_up: y, hands_together: u, two_hand_push: m, guard: o}

fake:               # owner: Nikhil. --fake mode players
  start_x_m: 0.6              # slot 0 at +x (image right), slot 1 at -x
  start_z_m: 1.6               # neutral, between the zones
  min_z_m: 0.8
  max_z_m: 3.5
  move_speed_mps: 1.0
  push_speed_mps: 3.0
  duck_m: 0.4
  guard_reach_m: 0.45         # the guard key moves the right wrist this far toward the camera
  focal_px: 525
