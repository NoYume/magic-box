[project]
name = "magic-box"
version = "0.1.0"
description = "Camera-only 1v1 magic duel console: ZED X + Jetson Orin Nano"
readme = "README.md"
requires-python = "==3.10.*"
dependencies = [
  "numpy>=1.24,<2",  # must match the numpy pyzed was built against; scripts/check_env.py verifies
  "pygame-ce>=2.5",
  "pyyaml>=6",
  "rapidfuzz>=3",
  "websockets>=14",
  "sounddevice>=0.4",
  "openai>=1.40",
]

[project.optional-dependencies]
laptop = ["opencv-python>=4.8"]  # never install on the Jetson: it shadows JetPack's cv2

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/magic_box"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["*.md"]  # ruff formats fenced code in markdown; plans and specs are not code

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pytest.ini_options]
testpaths = ["tests"]
